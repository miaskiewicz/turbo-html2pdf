<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>absolute with percentage insets + size</title></head>
  <body>
    <!-- Feature: an absolutely-positioned box whose top/left insets AND width/height
         are percentages resolve against the positioned ancestor's padding box.
         In a 300x200 relative parent: left 10%=30, top 25%=50, width 50%=150,
         height 40%=80. -->
    <style>
      #host { position: relative; width: 300px; height: 200px; margin-left: 20px; background: #eef }
      #ov { position: absolute; left: 10%; top: 25%; width: 50%; height: 40%; background: #fbb }
    </style>
    <div id="host" data-cid="host">
      <div id="ov" data-cid="ov">ov</div>
    </div>
  </body>
</html>
