<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>table colspan + row heights</title></head>
  <body>
    <!-- Feature: a fixed-layout table where a header cell spans two columns and a
         tall cell sets its row height. Checks the colspan cell's width (two columns)
         and that same-row cells share the row's height. -->
    <style>
      #t { border-collapse: collapse; table-layout: fixed; width: 200px }
      #t td { width: 100px; padding: 0; border: 1px solid #333; background: #cde }
      #span { background: #dec }
      #tall { height: 50px; background: #fbb }
    </style>
    <table id="t" data-cid="t">
      <tr><td id="span" data-cid="span" colspan="2">header</td></tr>
      <tr>
        <td id="tall" data-cid="tall">a</td>
        <td id="short" data-cid="short">b</td>
      </tr>
    </table>
  </body>
</html>
