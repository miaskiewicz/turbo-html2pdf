<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>adjacent margin collapsing</title></head>
  <body>
    <!-- Feature: margin collapsing between adjacent block siblings. The wrapper's
         padding stops the children's margins collapsing THROUGH it, isolating the
         sibling collapse: the gap between c1 and c2 is max(30, 20) = 30, not 50. -->
    <style>
      #wrap { padding: 10px; background: #eee }
      #c1 { height: 20px; margin: 0 0 30px 0; background: #cde }
      #c2 { height: 20px; margin: 20px 0 0 0; background: #dec }
    </style>
    <div id="wrap" data-cid="wrap">
      <div id="c1" data-cid="c1">c1</div>
      <div id="c2" data-cid="c2">c2</div>
    </div>
  </body>
</html>
