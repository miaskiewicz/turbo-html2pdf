<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>list marker indent</title></head>
  <body>
    <!-- Feature: UA default list layout. Browsers indent list items by a
         ~40px padding-left on ul/ol so markers have room. This measures the
         list item's left edge and the list's own default box. -->
    <style>
      #before { height: 10px; background: #eee }
    </style>
    <div id="before" data-cid="before"></div>
    <ul data-cid="ul">
      <li data-cid="li1">first item</li>
      <li data-cid="li2">second item</li>
    </ul>
    <ol data-cid="ol">
      <li data-cid="oli1">alpha</li>
      <li data-cid="oli2">beta</li>
    </ol>
  </body>
</html>
