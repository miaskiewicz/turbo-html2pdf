<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>grid named template-areas</title></head>
  <body>
    <!-- Feature: `grid-template-areas` named placement over a three-column track
         list (Wikipedia's Vector nav/main/rail skin). Origin: CHANGELOG 0.2.6. -->
    <style>
      #page { display: grid; width: 600px; gap: 0;
        grid-template-columns: 150px 1fr 120px;
        grid-template-areas: "nav main rail"; }
      #nav  { grid-area: nav;  height: 200px; background: #cde }
      #main { grid-area: main; height: 200px; background: #dec }
      #rail { grid-area: rail; height: 200px; background: #fbb }
    </style>
    <div id="page" data-cid="page">
      <div id="nav"  data-cid="nav">nav</div>
      <div id="main" data-cid="main">main</div>
      <div id="rail" data-cid="rail">rail</div>
    </div>
  </body>
</html>
