<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>inline-block row: wrap + vertical-align</title></head>
  <body>
    <!-- Feature: inline-block boxes flow like text and wrap when the row overflows;
         a taller chip sets the line-box height and vertical-align:top pins the
         others to the top. Checks chip origins across the wrap and the differing
         heights on one line. -->
    <style>
      #ibrow { width: 250px; font-size: 14px; line-height: 1 }
      .ib { display: inline-block; width: 70px; height: 30px; vertical-align: top; background: #cde }
      #c2 { height: 54px; background: #fbb }
    </style>
    <div id="ibrow" data-cid="ibrow">
      <span class="ib" id="c1" data-cid="c1">1</span>
      <span class="ib" id="c2" data-cid="c2">2</span>
      <span class="ib" id="c3" data-cid="c3">3</span>
      <span class="ib" id="c4" data-cid="c4">4</span>
    </div>
  </body>
</html>
