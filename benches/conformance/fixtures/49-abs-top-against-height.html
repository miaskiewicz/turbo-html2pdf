<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>absolute top:50% resolves against CB height</title></head>
  <body>
    <!-- Feature: a `%` top inset on an out-of-flow box resolves against the
         containing block's HEIGHT, not its width. `top:50%` of a 300x100 CB -> y=50
         (a width-based regression would give 150, off the bottom). Deliberately
         non-square CB. Origin: nike card overlays, CHANGELOG 0.2.14. -->
    <style>
      #host { position: relative; width: 300px; height: 100px; background: #eef }
      #ov { position: absolute; top: 50%; left: 0; width: 40px; height: 20px; background: #fbb }
    </style>
    <div id="host" data-cid="host"><div id="ov" data-cid="ov">o</div></div>
  </body>
</html>
