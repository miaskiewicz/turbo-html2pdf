<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>auto-inset absolute uses static position</title></head>
  <body>
    <!-- Feature: an auto-inset `position:absolute` box lands at its STATIC position
         (after the spacer, y~=40), NOT at the containing block's origin. The spacer
         moves the static position away from the origin so the two diverge (why
         minimal repros hid the bug). Origin: Wikipedia navbox labels,
         CHANGELOG 0.2.6. -->
    <style>
      #host { position: relative; width: 300px; height: 120px; background: #eef }
      #spacer { height: 40px; background: #ddd }
      #tag { position: absolute; width: 60px; height: 20px; background: #fbb }
    </style>
    <div id="host" data-cid="host">
      <div id="spacer" data-cid="spacer"></div>
      <div id="tag" data-cid="tag">tag</div>
    </div>
  </body>
</html>
