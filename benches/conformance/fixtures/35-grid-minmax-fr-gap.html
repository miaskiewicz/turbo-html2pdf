<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>grid minmax + fr + column-gap</title></head>
  <body>
    <!-- Feature: `minmax(min, 1fr)` + `2fr` flexible track sizing with a
         `column-gap` (Vector rails / card grids). Free space after the 20px gap
         (400) splits 1fr:2fr. Origin: CHANGELOG 0.2.5. -->
    <style>
      #g { display: grid; width: 420px;
        grid-template-columns: minmax(100px, 1fr) 2fr; column-gap: 20px }
      #l { height: 40px; background: #cde }
      #r { height: 40px; background: #dec }
    </style>
    <div id="g" data-cid="g"><div id="l" data-cid="l">l</div><div id="r" data-cid="r">r</div></div>
  </body>
</html>
