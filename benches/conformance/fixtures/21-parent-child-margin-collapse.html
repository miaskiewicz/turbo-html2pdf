<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>parent/child margin collapsing</title></head>
  <body>
    <!-- Feature: a child's top margin collapses THROUGH a parent that has no top
         border/padding, so the margin appears above the parent rather than inside
         it. The parent's top edge and the child's top edge coincide, offset from
         the previous block by the collapsed 40px. -->
    <style>
      #prev { height: 20px; background: #cde }
      #parent { background: #eee }
      #child { margin-top: 40px; height: 30px; background: #fbb }
    </style>
    <div id="prev" data-cid="prev">prev</div>
    <div id="parent" data-cid="parent">
      <div id="child" data-cid="child">child</div>
    </div>
  </body>
</html>
