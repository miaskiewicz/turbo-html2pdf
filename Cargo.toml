[workspace]
resolver = "2"
members = [
    "crates/turbo-html2pdf-core",
    "crates/turbo-pdf-napi",
    "crates/turbo-pdf-py",
    "crates/turbo-pdf-wasm",
    "crates/turbo-html2pdf-mcp",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-html2pdf"
authors = ["turbo-pdf contributors"]
# Real workspace floor: turbo-dom-layout / turbo-dom 0.7 declare rust-version 1.89
# (smol_str 0.3.6 sets it), above `napi-build` (1.88) and the core engine's
# font-subset stack (`subsetter`/`skrifa`/`write-fonts`, 1.85). So 1.89 is the MSRV.
rust-version = "1.89"

[workspace.dependencies]
minijinja = { version = "2", features = ["loader", "macros", "custom_syntax", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


# Pre-publish only (turbo-dom 0.7.1): turbo-dom and turbo-dom-layout come from turbo-dom's
# 0.7.1 release head (miaskiewicz/turbo-dom#298) until 0.7.1 is on crates.io. Remove this
# section and re-lock before tagging (PUBLISHING.md); release-guard fails while it is here.
[patch.crates-io]
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "a5e05113406292fc3471e44591397d1bb89943eb" }
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "a5e05113406292fc3471e44591397d1bb89943eb" }
